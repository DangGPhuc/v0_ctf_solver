[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "v0-ctf-solver"
version = "2.0.0"
description = "Autonomous CTF Lifecycle & Solving Suite tailored for Anti-IDE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
ctf = "ctf_core.cli.main:app"

[tool.setuptools.packages.find]
where = ["ctf_suite"]

[tool.pytest.ini_options]
testpaths = ["ctf_suite/tests"]
pythonpath = ["ctf_suite"]
