strategy:
- Challenge file provided `littlefs.logicdata` (Saleae Logic binary capture).
- 'Target system: Zephyr OS embedded device mounting LittleFS on external SPI NOR
  flash and reading `/lfs1/flag.txt`.'
- 'Capture analysis & binary patching:'
- Attempting to load `littlefs.logicdata` directly in Saleae Logic 1.2.29 threw `archive_exception(unsupported_version)`
  because the Boost binary serialization archive version in the file was 19 (`0x13`).
- 'Reverse engineered Logic 1.2.29 binary (`0x4af60f: cmp ax, [max_version]; 0x4af616:
  ja 4b2295`). Patched the 6-byte conditional jump with NOPs (`90 90 90 90 90 90`).'
- Successfully loaded the session via socket automation (`LOAD_FROM_FILE`) and exported
  digital channel transitions with `EXPORT_DATA2`.
- 'SPI Bus decoding:'
- 'Pins in recording: Channel 1 is CS (active low), Channel 2 is SCK, Channel 3 is
  MOSI (host MCU commands), Channel 0 is MISO (flash responses).'
