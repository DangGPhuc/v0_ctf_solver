strategy:
- 'Hyperelliptic curve $H: y^2 + y = x^{11}$ over $\mathbb{F}_p$ ($p \equiv 1 \pmod{11}$).'
- Genus $g = 5$. Jacobian elements represented in Mumford form $(u(x), v(x))$ with
  $u \mid (v^2 + v - x^{11})$.
- $D = (D_u, D_v)$ with known $D_u$. Over $\mathbb{F}_p[x]/D_u(x)$, $(2 D_v + 1)^2
  \equiv 1 + 4 x^{11}$. Factoring $D_u$ into degree 1 and two degree 2 factors and
  computing square roots in the finite fields yields 8 candidate values for $e = D_v(0)$.
- Using Weil's theorem and Davenport-Hasse relations, the Frobenius eigenvalues on
  $J(H)$ are $\alpha_j = - J(\chi^j, \chi^j)$ where $\chi$ is of order 11.
- In $\mathbb{Q}(\zeta_{11})$, Stickelberger's theorem gives $(J(\chi, \chi)) = \prod_{a=6}^{10}
  \sigma_a^{-1}(\mathfrak{p}_1)$. Using PARI/GP `bnfisprincipal` and Eisenstein reciprocity
  $J(\chi, \chi) \equiv -1 \pmod{(1 - \zeta_{11})^2}$, the exact Jacobi sum and Frobenius
  characteristic polynomial $P(T)$ are determined.
- Group order $\#J(\mathbb{F}_p) = P(1)$ is computed and verified via Cantor's algorithm
  on `ct`.
- Inverting $d = e^{-1} \pmod{\#J(\mathbb{F}_p)}$ and computing $d \cdot ct$ returns
  $J(P) = (x - \text{flag}, y_{\text{flag}})$, revealing the flag directly.
