strategy:
- Queried Ecovacs OTA API (`portal-ww.ecouser.net`) for model `659yh8` (T9 AIVI) firmware
  1.4.9 (`px30-zj2011_fw-1.4.9.bin`).
- Decrypted the firmware image using AES-CBC with derived keys and unpacked `normal_fs.img`
  (SquashFS).
- Reverse engineered `/etc/www/reqDo` (64-bit ARM ELF CGI).
- Discovered unauthenticated JSON command handler `parseJsonCmd` with command `SetFct`.
- '`SetFct` formats `did`, `password`, `type`, `lb` into shell command string `td=SetFct
  did=%s password=%s type=%s lb=%s %s` and executes it directly with `popen(cmd, "r")`.
  Output from `popen` is printed directly back into the HTTP response.'
- 'Sending `POST /` with `{"td":"SetFct","did":"x; cat /root/flag.txt; #","password":"p","type":"t","lb":"l"}`
  executed the command as root and returned the flag.'
