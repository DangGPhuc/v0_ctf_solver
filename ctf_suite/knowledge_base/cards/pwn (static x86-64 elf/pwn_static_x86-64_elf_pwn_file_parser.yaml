strategy:
- Binary `fileparser` is a statically linked 64-bit ELF without PIE (`0x400000`),
  without Stack Canary, Partial RELRO, and NX enabled.
- '`wrapper.py` receives a base64-encoded file, writes it to `/tmp/*.k`, and executes
  `./fileparser <path>`.'
- 'Disassembly of `main`:'
- '1. Reads 16-byte header from file:'
- 'Offset `+0x00`: 4-byte Magic (checked against `0x07030301`).'
- 'Offset `+0x04`: 4-byte `Length` $N$.'
- 'Offset `+0x08`: 8-byte Checksum.'
- 2. Reads $N$ bytes into stack buffer `[rbp-0x110]` via `fread(rbp-0x110, 1, Length,
  fp)`.
